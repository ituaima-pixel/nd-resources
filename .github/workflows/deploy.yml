name: Deploy to SiteGround

on:
  push:
    branches: [main]
    paths: ["site/**", "deploy/**", "scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch covers for new books
        run: |
          python3 scripts/fetch_covers.py || echo "::warning::Cover lookup failed; plain covers will be shown"
          if [ -n "$(git status --porcelain site/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/images
            git commit -m "Add book cover images"
            git push
          fi

      - name: Build a page for every book and section (for search engines)
        run: |
          npm install --no-save --no-package-lock --silent playwright-core@1.49.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node scripts/build_pages.cjs

      - name: Check SiteGround secrets are set
        id: check
        env:
          SG_KEY: ${{ secrets.SG_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          if [ -z "$SG_KEY" ] || [ -z "$SG_HOST" ] || [ -z "$SG_USER" ]; then
            echo "::notice::SiteGround secrets are not set yet, so nothing was uploaded. See README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        if: steps.check.outputs.ready == 'true'
        env:
          SG_KEY: ${{ secrets.SG_KEY }}
          SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_KEY" > ~/.ssh/sg_key
          chmod 600 ~/.ssh/sg_key
          # SiteGround keys usually have a password; remove it from this temporary copy only
          if [ -n "$SG_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SG_KEY_PASSPHRASE" -N "" -f ~/.ssh/sg_key >/dev/null
          fi
          ssh-keyscan -p "${SG_PORT:-18765}" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload site files
        if: steps.check.outputs.ready == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          # Stamp this deploy into cover image links so browsers fetch changed covers
          find public -name '*.html' -exec sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" {} +
          # No --delete: other folders in public_html (like old-wordpress) are left alone
          rsync -rvz --checksum \
            -e "ssh -p ${SG_PORT:-18765} -i ~/.ssh/sg_key" \
            public/ "$SG_USER@$SG_HOST:${SG_PATH:-www/neurodivergentresources.co.uk/public_html}/"
          # The images folder belongs only to this site, so remove covers that were deleted here
          rsync -rvz --checksum --delete \
            -e "ssh -p ${SG_PORT:-18765} -i ~/.ssh/sg_key" \
            public/images/ "$SG_USER@$SG_HOST:${SG_PATH:-www/neurodivergentresources.co.uk/public_html}/images/"

      - name: Tell browsers to always check for the latest pages
        if: steps.check.outputs.ready == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          P="${SG_PATH:-www/neurodivergentresources.co.uk/public_html}"
          ssh -p "${SG_PORT:-18765}" -i ~/.ssh/sg_key "$SG_USER@$SG_HOST" "cd $P && touch .htaccess && if grep -q 'BEGIN ND-RESOURCES-CACHE' .htaccess; then echo 'Cache rules already present'; else cat >> .htaccess && echo 'Cache rules added'; fi" < deploy/htaccess-cache.txt

      - name: Check the live site
        if: steps.check.outputs.ready == 'true'
        run: |
          for f in "" shop/ books/explaining-audhd/ sitemap.xml robots.txt products.json; do
            echo "== /$f"; curl -sSI "https://neurodivergentresources.co.uk/$f?ci=$GITHUB_RUN_ID" | grep -iE "^(HTTP|cache-control|expires|x-proxy-cache|x-cache)" || true
          done
          for u in http://neurodivergentresources.co.uk/ https://www.neurodivergentresources.co.uk/ https://neurodivergentresources.co.uk/shop https://neurodivergentresources.co.uk/no-such-page/; do
            echo "== $u"; curl -sSI "$u" | grep -iE "^(HTTP|location)" || true
          done
          echo "== /books/explaining-audhd/ head"; curl -s "https://neurodivergentresources.co.uk/books/explaining-audhd/?ci=$GITHUB_RUN_ID" | grep -oE "<title>[^<]*</title>|<link rel=\"canonical\"[^>]*>" || true
          if curl -s "https://neurodivergentresources.co.uk/?ci=$GITHUB_RUN_ID" | grep -q "ND Resources"; then
            echo "Live page answered with the ND Resources site"
          else
            echo "::warning::Could not read the live page (SiteGround sometimes shows automated visitors a check page). The upload itself succeeded."
          fi

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/sg_key
